name: .NET Core Test Runner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup the .NET SDK
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Change this if your project uses .NET 6.0 or .NET 9.0

    # 3. Cache NuGet packages for faster consecutive runs
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # 4. Restore dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 5. Build the entire application
    - name: Build Application
      run: dotnet build --configuration Release --no-restore

    # 6. Run all tests in the solution
    - name: Run Application Tests
      run: dotnet test --configuration Release --no-build --verbosity normal
