name: .NET Core Test Runner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the source code from your GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Install the appropriate .NET SDK environment
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Update to '9.0.x' if you have upgraded your project target

    # 3. Cache NuGet packages to decrease build times across workflow run repetitions
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # 4. Resolve package dependencies
    - name: Restore Dependencies
      run: dotnet restore

    # 5. Compile the C# binaries in Release configuration
    - name: Build Application
      run: dotnet build --configuration Release --no-restore

    # 6. Execute all validation unit tests
    - name: Run Login Validation Tests
      run: dotnet test --configuration Release --no-build --verbosity normal
